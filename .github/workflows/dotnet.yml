name: .NET

on:
  push:
    branches: [ master ]
    paths-ignore: [ '**.md', 'images/**', 'LICENSE.md' ]
  pull_request:
    branches: [ master ]
    paths-ignore: [ '**.md', 'images/**', 'LICENSE.md' ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    # Azurite emulates Azure Storage so the integration tests run without a
    # live storage account. It is started with docker run rather than as a
    # service container because it needs --skipApiVersionCheck: the Azure SDK
    # sends an API version newer than Azurite knows about and Azurite rejects
    # it with a 400 otherwise. Only the queue port (10001) is mapped.
    - name: Start Azurite
      run: |
        docker run -d --name azurite -p 10001:10001 \
          mcr.microsoft.com/azure-storage/azurite \
          azurite --queueHost 0.0.0.0 --blobHost 0.0.0.0 --tableHost 0.0.0.0 --skipApiVersionCheck --silent
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: |
          8.0.x
    - name: Restore dependencies
      run: dotnet restore
    - name: Build
      run: dotnet build --no-restore
    - name: Test
      env:
        # UseDevelopmentStorage=true targets the Azurite emulator above.
        Storage__ConnectionString: "UseDevelopmentStorage=true"
        Storage__QueueName: "integration-test-queue"
      run: dotnet test --no-build --verbosity normal -p:ParallelizeTestCollections=false